<main>
  <div class="container">
    <div class="status-bar" *ngIf="loading() || error()">
      <p *ngIf="loading()">Loading...</p>
      <p *ngIf="error()" class="error-msg">{{ error() }}</p>
    </div>

    <app-header-tabs [tabs]="tabs()" (tabSelected)="onTabSelected($event)" (addNew)="onAddNew()"
      (deleteTab)="onDeleteTab($event)"></app-header-tabs>

    <div class="content-area">
      <app-contact-form [data]="selectedContactData()" [loading]="loading()"
        (formSubmit)="onFormSubmit($event)"></app-contact-form>
    </div>
  </div>
</main>
