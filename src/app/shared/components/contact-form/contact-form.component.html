<form [formGroup]="contactForm" (ngSubmit)="submit()" class="contact-form">
    <div class="form-grid">
        <div class="form-field">
            <label for="firstName">First Name <span class="required">*</span></label>
            <input type="text" id="firstName" formControlName="firstName" [class.error]="hasError('firstName')">
            <div class="error-msg" *ngIf="hasError('firstName')">
                First name is required
            </div>
        </div>

        <div class="form-field">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" formControlName="lastName">
        </div>

        <div class="form-field">
            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" formControlName="email" [class.error]="hasError('email')">
            <div class="error-msg"
                *ngIf="contactForm.get('email')?.hasError('required') && contactForm.get('email')?.touched">
                Email is required
            </div>
            <div class="error-msg"
                *ngIf="(contactForm.get('email')?.hasError('email') || contactForm.get('email')?.hasError('pattern')) && contactForm.get('email')?.touched">
                Please enter a valid email address
            </div>
        </div>

        <div class="form-field">
            <label for="phone">Phone</label>
            <input type="text" id="phone" formControlName="phone" mask="(000) 000-0000" [class.error]="hasError('phone')">
            <div class="error-msg" *ngIf="hasError('phone')">
                Please enter a valid phone number (10 digits)
            </div>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" [disabled]="contactForm.invalid || loading">
            {{ loading ? 'Saving...' : 'Save' }}
        </button>
    </div>
</form>
